# This file is included inside the stock Nginx http block.
# All logged visitor input is reduced to a finite set of public labels.
map $arg_event $event_name {
    default invalid;
    arrival arrival;
    click click;
}
map "$request_method:$event_name" $log_event {
    default 0;
    POST:arrival 1;
    POST:click 1;
}
map $arg_page $event_page {
    default other;
    ~^(about|projects|blog|contact|cnsnmm-internship-2024|athena-studio-internship-2025-full|salomon-internship-complete-journey|french-ski-federation|internship-search|salomon-mission)$ $arg_page;
}
map $arg_target $event_target {
    default other;
    ~^(page|linkedin|github|cv|email|play_demo|navigation_projects|navigation_blog|navigation_contact|navigation_home|open_article|open_project|project_link|connectors_documentation|cnsnmm_story|ski_federation_story|button)$ $arg_target;
}
map $arg_content $event_content {
    default none;
    ~^(quantization-demo|kaggle-sdd-vision|hpc-cuda|kaggle-sdd-machine-learning|ml-authors|turbokmeans|hpc-mpi|sokoban|hack-days-ens|sql|cnsnmm-internship-2024|athena-studio-internship-2025-full|salomon-internship-complete-journey|french-ski-federation|internship-search|salomon-mission)$ $arg_content;
}
map $arg_view $event_view {
    default unknown;
    "~^[a-f0-9]{32}$" $arg_view;
}
map $arg_source $event_source {
    default unknown;
    ~^(direct|internal|external|google|linkedin|github)$ $arg_source;
}
map $http_user_agent $browser {
    default other;
    ~*Edg/ Edge;
    ~*Firefox/ Firefox;
    ~*Chrome/ Chrome;
    ~*Safari/ Safari;
}
map $http_user_agent $os {
    default other;
    ~*(iPhone|iPad) iOS;
    ~*Android Android;
    ~*Windows Windows;
    ~*Macintosh macOS;
    ~*Linux Linux;
}
map $http_user_agent $device {
    default desktop_or_other;
    ~*(iPad|Tablet) tablet;
    ~*(Mobile|iPhone|Android) mobile;
}
map $http_accept_language $language {
    default other;
    ~*^fr fr;
    ~*^en en;
    ~*^es es;
    ~*^de de;
    ~*^it it;
    ~*^pt pt;
}
log_format portfolio_event escape=json
    '{"type":"portfolio_event","timestamp":"$time_iso8601",'
    '"pod":"$hostname","event":"$event_name","page":"$event_page",'
    '"target":"$event_target","content":"$event_content",'
    '"view_id":"$event_view","browser":"$browser","os":"$os",'
    '"device":"$device","language":"$language","source":"$event_source"}';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # No default combined log: it contains raw URLs, IPs and referrers.
    access_log off;
    log_not_found off;

    location = /__events {
        access_log /dev/stdout portfolio_event if=$log_event;
        add_header Cache-Control "no-store" always;
        if ($log_event = 0) { return 400; }
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
