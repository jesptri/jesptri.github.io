<!DOCTYPE html>
<html lang="en">
<head>
  {% include analytics.html %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - {{ site.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" rel="stylesheet">
  <link href="{{ '/css/bulma.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/index.css' | relative_url }}" rel="stylesheet">
  <script defer src="{{ '/js/fontawesome.all.min.js' | relative_url }}"></script>
</head>
<body>
  <section class="section">
    <div class="container is-max-widescreen">
      <nav class="breadcrumb" aria-label="breadcrumbs">
        <ul>
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li class="is-active"><a href="#" aria-current="page">{{ page.title }}</a></li>
        </ul>
      </nav>
      <div class="content">
        {{ content }}
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="content footer-links has-text-centered">
        <a class="external-link button is-light is-small" href="mailto:{{ site.email }}" target="_blank">
          <span class="icon is-small"><i class="far fa-envelope"></i></span>
        </a>
        <a class="external-link button is-light is-small" href="{{ '/Jules_ESPINOUX_Resume.pdf' | relative_url }}" target="_blank">
          <span class="icon is-small"><i class="fas fa-file-alt"></i></span>
        </a>
        <a class="external-link button is-light is-small" href="https://www.linkedin.com/in/jules-espinoux/" target="_blank">
          <span class="icon is-small"><i class="fab fa-linkedin"></i></span>
        </a>
        <a class="external-link button is-light is-small" href="https://github.com/{{ site.github_username }}" target="_blank">
          <span class="icon is-small"><i class="fab fa-github"></i></span>
        </a>
      </div>
      <p class="site-footer">
        &copy; {{ site.name }} - {{ "now" | date: "%Y" }}
      </p>
    </div>
  </footer>
</body>
</html>
