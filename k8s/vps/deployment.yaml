
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jules-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jules-website
  template:
    metadata:
      labels:
        app: jules-website
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: jules-website
          image: ghcr.io/jesptri/website:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80