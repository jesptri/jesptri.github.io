
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jules-website
  namespace: portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jespinoux.fr
      secretName: jules-website-tls
  rules:
    - host: jespinoux.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jules-website
                port:
                  number: 80