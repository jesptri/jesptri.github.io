apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jules-website-http
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jespinoux.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jules-website
                port:
                  number: 80